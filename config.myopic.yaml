  grouping_years_heat: [1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2019] # these should not extend 2020

load_options: # this is elec only (only profile is kept, totals are overwritten by demand_data)
  ssp: "ssp2-2.6" # shared socio-economic pathway (GDP and population growth) scenario to consider
  weather_year: 2013 # Load scenarios available with different weather year (different renewable potentials)
  prediction_year: 2020 # Load scenarios available with different prediction year (GDP, population)
  scale: 1.0 # scales all load time-series, i.e. 2 = doubles load

demand_data: # this is sector-coupled
  update_data: true # if true, the workflow downloads the energy balances data saved in data/demand/unsd/data again. Turn on for the first run.
  base_year: 2019

  other_industries: false # Whether or not to include industries that are not specified. some countries have has exaggerated numbers, check carefully.
  aluminium_year: 2019 # Year of the aluminium demand data specified in `data/AL_production.csv`

costs:
  year: 2020 
  customized: true # added by Theo // set to true to skip downloading costs but still use resources/ + RDIR + costs_{planning_horizons/year}.csv
  version: v0.13.2
  discountrate: [0.071] #, 0.086, 0.111]
  # [EUR/USD] ECB: https://www.ecb.europa.eu/stats/exchange/eurofxref/html/eurofxref-graph-usd.en.html # noqa: E501
  USD2013_to_EUR2013: 0.7532 # [EUR/USD] ECB: https://www.ecb.europa.eu/stats/exchange/eurofxref/html/eurofxref-graph-usd.en.html
  rooftop_share: 0.14 # based on the potentials, assuming  (0.1 kW/m2 and 10 m2/person)
  fill_values:
    FOM: 0
    VOM: 0
    efficiency: 1
    fuel: 0
    investment: 0
    lifetime: 25
    CO2 intensity: 0
    discount rate: 0.07
  marginal_cost: # EUR/MWh
    solar: 0.01
    onwind: 0.015
    offwind: 0.015
    hydro: 0.
    H2: 0.
    electrolysis: 0.
    fuel cell: 0.
    battery: 0.
    battery inverter: 0.
  emission_prices: # in currency per tonne emission, only used with the option Ep
    co2: 0.
  # investment: # EUR/MW
  #   CCGT: 830000
  # FOM: # %/year
  #   CCGT: 3.35
  # VOM: # EUR/MWh
  #   CCGT: 4.2
  # fuel: # EUR/MWh
  #   gas: 10.1
  # lifetime: # years
  #   CCGT: 25.0
  # efficiency: # per unit
  #   CCGT: 0.58
  lines:
    length_factor: 1.25 #to estimate offwind connection costs


cluster_options:
  simplify_network:
    to_substations: false # network is simplified to nodes with positive or negative power injection (i.e. substations or offwind connections)
    algorithm: kmeans # choose from: [hac, kmeans]
    feature: solar+onwind-time # only for hac. choose from: [solar+onwind-time, solar+onwind-cap, solar-time, solar-cap, solar+offwind-cap] etc.
    exclude_carriers: []
    remove_stubs: true
    remove_stubs_across_borders: false
    p_threshold_drop_isolated: 20 # [MW] isolated buses are being discarded if bus mean power is below the specified threshold
    p_threshold_merge_isolated: 300 # [MW] isolated buses are being merged into a single isolated bus if a bus mean power is below the specified threshold
    s_threshold_fetch_isolated: false # [-] a share of the national load for merging an isolated network into a backbone network
  cluster_network:
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
  alternative_clustering: false # "False" use Voronoi shapes, "True" use GADM shapes
  distribute_cluster: ["load"] # Distributes cluster nodes per country according to ['load'],['pop'] or ['gdp']

renewable:
  onwind:
    cutout: cutout-2013-era5
  offwind-ac:
    cutout: cutout-2013-era5
  offwind-dc:
    cutout: cutout-2013-era5
  solar:
    cutout: cutout-2013-era5
  hydro:
    cutout: cutout-2013-era5
    hydrobasins_level: 6
    resource:
      method: hydro
      hydrobasins: data/hydrobasins/hybas_world.shp
      flowspeed: 1.0 # m/s
      # weight_with_height: false
      # show_progress: true
    carriers: [ror, PHS, hydro]
    PHS_max_hours: 6
    hydro_max_hours: "energy_capacity_totals_by_country" #energy_capacity_totals_by_country
    hydro_max_hours_default: 12.0 # (optional, default 6) Default value of max_hours for hydro when NaN values are found
    clip_min_inflow: 1.0
    extendable: true
    normalization:
      method: eia # 'hydro_capacities' to rescale country hydro production by using hydro_capacities, 'eia' to rescale by eia data, false for no rescaling
      year: 2020 # (optional) year of statistics used to rescale the runoff time series. When not provided, the cutout weather year is used
    multiplier: 1.0
  csp:
    cutout: cutout-2013-era5

solving:
  options:
    formulation: kirchhoff
    load_shedding: true
    noisy_costs: true
    min_iterations: 4
    max_iterations: 6
    clip_p_max_pu: 0.01
    skip_iterations: true
    track_iterations: false
    assign_all_duals: true
    # nhours: 10

  solver:
    name: gurobi
    options: gurobi-default # gurobi-nocross # gurobi-high-precision

  solver_options:
    highs-default:
      # refer to https://ergo-code.github.io/HiGHS/dev/options/definitions/
      threads: 4
      solver: "ipm"
      run_crossover: "off"
      small_matrix_value: 1e-6
      large_matrix_value: 1e9
      primal_feasibility_tolerance: 1e-5
      dual_feasibility_tolerance: 1e-5
      ipm_optimality_tolerance: 1e-4
      parallel: "on"
      random_seed: 123
    gurobi-default:
      threads: 32 
      method: 2 # barrier
      crossover: 0
      BarConvTol: 1.e-5 # 1.e-6
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200
    gurobi-numeric-focus:
      NumericFocus: 3 # Favour numeric stability over speed
      method: 2 # barrier
      crossover: 0 # do not use crossover
      BarHomogeneous: 1 # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5
      FeasibilityTol: 1.e-4 
      OptimalityTol: 1.e-4 
      ScaleFlag: -1 
      threads: 32
      Seed: 123
      DualReductions: 0
      InfUnbdInfo: 1
    gurobi-tested:
      FeasibilityTol: 0.0001
      OptimalityTol: 0.0001
      Method: 2
      BarConvTol: 1.e-5
      Crossover: 0
      AggFill: 10
      PreDual: 0
      NumericFocus: 3
      PrePasses: 2
      Presolve: 2
      Threads: 24
    gurobi-high-precision:
      NumericFocus: 3
      Method: 2
      Crossover: 1
      FeasibilityTol: 1.e-6
      OptimalityTol: 1.e-6
      ScaleFlag: 2
      Quad: 1
      Threads: 32
      ObjScale: 1
      Seed: 123
      BarHomogeneous: 1
      BarConvTol: 1e-8
      BarOrder: 2
    gurobi-cross:
      NumericFocus: 3          # Favor numeric stability over speed
      Method: 2                # Barrier
      Crossover: 1             # Force crossover on
      BarConvTol: 1.e-8        # Tighter barrier stop -> cleaner handoff to crossover
      BarHomogeneous: -1       # Let Gurobi choose (only use 1 if it picks it)
      BarCorrectors: 2         # More robust barrier steps
      FeasibilityTol: 1.e-6    # Cleaner feasibility for tough models
      OptimalityTol: 1.e-6     # Cleaner optimality for tough models
      ObjScale: 0              # Auto (avoid negative scaling)
      ScaleFlag: -1            # Auto scaling
      Quad: 1                  # Quad precision in sensitive areas
      Threads: 12
      Seed: 123
    gurobi-nocross:
      Method: 2            # Barrier
      Crossover: 0         # Skip crossover big walltime win
      Threads: 32          # Try 32 first; also test 48 or 64 and keep the best
      NumericFocus: 2      # Still cautious, but a bit faster than 3
      BarConvTol: 1.e-7    # Slightly looser; fewer barrier iters, typically same quality
      BarCorrectors: -1    # Let Gurobi pick adaptively
      BarHomogeneous: -1   # Auto
      FeasibilityTol: 1.e-6
      OptimalityTol: 1.e-6
      ObjScale: 0
      ScaleFlag: -1
      Quad: 1
      Seed: 123
    gurobi-dual-simplex:
      NumericFocus: 3
      Method: 1                # Dual simplex (no barrier, no crossover needed)
      Crossover: 0
      FeasibilityTol: 1.e-6
      OptimalityTol: 1.e-6
      ObjScale: 0
      ScaleFlag: -1
      Quad: 0                  # Not used by simplex; can leave 0
      Threads: 12
      Seed: 123
    gurobi-fallback: # Use gurobi defaults
      crossover: 0
      method: 2 # barrier
      BarHomogeneous: 1 # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5
      FeasibilityTol: 1.e-5
      OptimalityTol: 1.e-5
      Seed: 123
      threads: 8
    cplex-default:
      threads: 4
      lpmethod: 4 # barrier
      solutiontype: 2 # non basic solution, ie no crossover
      barrier.convergetol: 1.e-5
      feasopt.tolerance: 1.e-6
    copt-default:
      Threads: 8
      LpMethod: 2
      Crossover: 0
    cbc-default: {} # Used in CI
    glpk-default: {} # Used in CI

  mem: 300000 #memory in MB; 20 GB enough for 50+B+I+H2; 100 GB for 181+B+I+H2