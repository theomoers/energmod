run:
  name: "Earth_200" # use this to keep track of runs with different settings
  sector_name: "Global_200" # use this to keep track of sector scenario runs
  shared_cutouts: true # set to true to share the default cutout(s) across runs
  allow_scenario_failure: true # If True, the workflow will continue even if a scenario in run_scenario fails

countries: ["Global"]

scenario:
  simpl: [""]
  ll: ["copt"] # c1.0c
  clusters: [200] 
  opts: [1h]
  planning_horizons:
  - 2020
  - 2025
  - 2030
  - 2035
  - 2040
  - 2045
  - 2050
  sopts:
  - "1h"
  demand:  # Demand scenarios - data must exist in data/demand/scenarios/{scenario}/
  - "AB"  # AB=central (baseline), NZ=fast_electrification, DF=fossil era
  #- "NZ"
  #- "DF"
  learning_rate:  # Canonical format: tech_code.methodvalue, e.g. s.o0.10 or w.m1.10; use "base" for no adjustment
  - "base"
  learning_model:
  - "legacy_curve"

foresight: myopic

additional_sector_clustering:
  enable: false # enable clustering in solve_network
  mode: kmeans # manual: use global.cluster.yaml, kmeans: use clustering algorithm 
  validate_aggregation: true # run the static/time-series conservation checks after clustering
  overwrite_universal_busmap: true

  # for manual:
  manual_mapping_file: configs/global.cluster.yaml
  manual_missing_policy: singleton 

  # for kmeans:
  n_clusters: 90 # final number of clusters (may be lower than numbers of countries)
  random_state: 42
  pca_components: 5 # how many principal components of each country’s hourly demand to keep
  enforce_contiguity: true  # post-process to split geographically disconnected clusters
  include_p_max_pu_features: true
  p_max_pu_components: 3      # PCs per CF group
  p_max_pu_by_tech: true      # separate PCA for solar/onwind/offwind/hydro groups
  p_max_pu_tech_groups:
    solar: ["solar"]
    onwind: ["onwind"]
    offwind: ["offwind-ac", "offwind-dc", "offwind"]
  

# Rolling horizon settings (myopic with lookahead)
rolling_horizon:
  enable: false  # Set to true to enable rolling horizon (solves t and t+1 together, commits t)
  window_size: 2  # Number of investment periods to solve together (e.g., 2 means solve t and t+1)
  social_discountrate: 0.00  # Social discount rate for weighting future periods in the window

temporal_clustering:
  activate: true
  n_periods: 10 # number of typical periods (e.g., typical days)
  hours: 24 # hours per period (24 for daily clustering)
  clusterMethod: 'k_medoids'  # clustering algorithm: 'hierarchical', 'k_means', 'k_medoids'
  extremePeriodMethod: 'new_cluster_center'  # how to handle extreme periods
  normed: true # normalize timeseries before clustering
  overwrite_time_dfs: false  # whether to overwrite time-dependent data with clustered values
  
enable:
  retrieve_databundle: false 
  retrieve_databundle_sector: false
  retrieve_cost_data: false # needs to be false if permstore is used for costs
  download_osm_data: false 
  build_natura_raster: false 
  build_cutout: false
  # If "build_cutout" : true, then environmental data is extracted according to `snapshots` date range and `countries`
  # requires cds API key https://cds.climate.copernicus.eu/api-how-to
  # More information https://atlite.readthedocs.io/en/latest/introduction.html#datasets
  progress_bar: true # show progress bar during downloading routines and other long-running tasks

global_specific:
  save_lpfile: false
  remove_faulty_offshore_shapes: true # for offwind profiles, remove faulty shapes that cause crashes
  global_clustering: true # must be true to apply minimum clustering per country
  minimum_clustering_per_countries:
    US: 2
    BR: 2
    RU: 2
    CN: 3
    IN: 2
  
  baseyear_nonextendable: true # If true, all existing capacities in the baseyear (first planning horizon) are set to non-extendable
  baseyear_generation:
    baseyear_generation_constraint: true # 2020 country-level electricity generation constrained to OWID historical values
    year: 2020
    owid_csv: validation/data/owid-energy-data.csv
    electricity_demand_baseline_network: results/Global_200/postnetworks/elec_s_200_ec_lcopt_1h_1h_2020_0.071_AB_0.0export_base.nc
    electricity_demand_end_use_link_output_bus_carrier_substrings: ["heat"]
    tolerance: 0.10
    absolute_tolerance_twh: 0.25
    min_reference_twh: 1.0
    min_country_electric_load_twh: 0.5
    slack_penalty_eur_per_mwh: 200.0
    units: TWh
    link_bus_carrier: AC
    gen_bus_carrier: AC
    metrics:
      - coal_electricity
      - gas_electricity
      - oil_electricity
      - biofuel_electricity
      - hydro_electricity
      - nuclear_electricity
      - solar_electricity
      - wind_electricity
      - other_renewable_electricity
      - electricity_generation

  year2025_generation: 
    year2025_generation_constraint: false
    year: 2025 # numbers below are 2024 but we have 10% tolerance
    tolerance: 0.1
    units: TWh
    link_bus_carrier: AC
    gen_bus_carrier: AC
    targets:
      solar: 2130.0
      onshore_wind: 2350.0
      offshore_wind: 250.0
      hydro: 4418.0
      nuclear: 2760.0
      coal_lignite_power: 10587.0
      gas_power: 6795.0
      oil_power: 857.0
      biomass: 712.0
      geothermal: 88.0
    carriers_map:
      solar: ["solar"]
      onshore_wind: ["onwind"]
      offshore_wind: ["offwind-ac","offwind-dc"]
      hydro: ["ror", "hydro"]
      nuclear: ["nuclear"]
      coal_lignite_power: ["coal", "lignite"]
      gas_power: ["CCGT","OCGT"]
      oil_power: ["oil"]
      biomass: 
        - "urban central solid biomass CHP CC"
        - "urban central solid biomass CHP"
        - "biomass"
        - "biomass EOP"
      geothermal: ["geothermal"]

  year2025_capacity:
    year2025_capacity_constraint: true
    year: 2025
    units: GW
    irena_csv: validation/data/IRENA_2024CAPA.csv
    reference_year: 2024
    fallback_to_latest_available: false
    geothermal_extendable_fallback: true
    lower_multiplier: 1.0 # 2025 must be at least 2024 installed capacity
    upper_multiplier: 1.5 # allow up to +20% growth from 2024 to 2025
    min_reference_mw: 1.0
    absolute_tolerance_mw: 0.0
    irena_technology_by_constraint:
      solar: ["Solar photovoltaic"] # excludes CSP / solar thermal
      onwind: ["Onshore wind energy"]
      offshore_wind: ["Offshore wind energy"]
      geothermal: ["Geothermal energy"]
    model_carriers_by_constraint:
      solar: [solar]
      onwind: [onwind]
      offshore_wind: [offwind-ac, offwind-dc]
      geothermal: [geothermal]
    nodal_distribution_limit:
      enable: false
      carriers: [onwind, solar]
      max_baseyear_share_multiplier: 1.5
      new_bus_share_multiplier: 0.5
      new_bus_flattening_exponent: 0.5
    global_capacity_band:
      enable: true
      year: 2025
      tolerance: 0.05
      units: GW
      targets:
        solar: 2383.0
        onwind: 1999.0

permstore:
  enable: true
  path: /shared/share_cki25/energymodels/pypsa-earth/permstorage
  scenario: "Global_200"
  use:
    shapes: true
    base_network: true
    bus_regions: true # should be false if base_network is false !
    demand_profiles: true # elec only
    powerplants: true 
    pop_layouts: true
    pop_layouts_clustered: true
    temperatures: true
    heat_demand: true
    transport_data: true
    gas_network: true
    industry_distribution: false # adjusted for gadm clustering
    elec_prepared: false
    renewable_profiles: true
    solar_thermal_profile: true
    costs: true
    raw_osm: true
    clean_osm: true
    base_energy_totals: true # use permstorage for energy_totals_base instead of downloading from UN database 

electricity:
  extendable_carriers:
      Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT, CCGT]
      StorageUnit: [] # battery, H2
      Store: [battery, H2]
      Link: [H2 pipeline] # H2 pipeline
  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]
  renewable_carriers: [solar, onwind, hydro, offwind-ac, offwind-dc] 
  
  powerplants_filter: (DateOut > 2020 or DateOut != DateOut) and not (Country == 'Germany' and Fueltype == 'Nuclear') # not actively used
  custom_powerplants: replace #  "false" use only powerplantmatching (ppm) data, "merge" combines ppm and custom powerplants, "replace" use only custom powerplants
  
  estimate_renewable_capacities:
    stats: "irena" # False, = greenfield expansion, 'irena' uses IRENA stats to add expansion limits
    year: 2020 # Reference year, available years for IRENA stats are 2000 to 2023
    p_nom_min: 1 # any float, scales the minimum expansion acquired from stats, i.e. 110% of <years>'s capacities => p_nom_min: 1.1
    p_nom_max: false # sets the expansion constraint, False to deactivate this option and use estimated renewable potentials determine by the workflow, float scales the p_nom_min factor accordingly
    technology_mapping:
      # Wind is the Fueltype in ppm.data.Capacity_stats, onwind, offwind-{ac,dc} the carrier in PyPSA-Earth
      Offshore: [offwind-ac, offwind-dc]
      Onshore: [onwind]
      PV: [solar]

build_osm_network:
  group_tolerance_buses: 20000 # [m] (default 5000) Tolerance in meters of the close buses to merge
  force_ac: true # When true, it forces all components (lines and substation) to be AC-only. To be used if DC assets create problem.
  split_overpassing_lines: false # When True, lines overpassing buses are splitted and connected to the buses

build_shape_options:
  gadm_layer_id: 0 # GADM level area used for the gadm_shapes. Codes are country-dependent but roughly: 0: country, 1: region/county-like, 2: municipality-like
  simplify_gadm: true # When true, shape polygons are simplified else no
  update_file: false # When true, all the input files are downloaded again and replace the existing files
  out_logging: true # When true, logging is printed to console
  year: 2020 # reference year used to derive shapes, info on population and info on GDP
  nprocesses: 10 # number of processes to be used in build_shapes

# ------------------- SECTOR OPTIONS -------------------

fossil_reserves:
  oil: 100 #TWh Maybe redundant

export:
  endogenous: false # If true, the export demand is endogenously determined by the model
  endogenous_price: 400 # EUR/MWh # Market price, for wich the hydrogen for endogenous exports is sold. Only considered, if ["export"]["endogenous"] is set to true.
  store: true # [True, False] # specifies whether an export store to balance demand is implemented
  store_capital_costs: "no_costs" # ["standard_costs", "no_costs"] # specifies the costs of the export store. "standard_costs" takes CAPEX of "hydrogen storage tank type 1 including compressor"
  h2export: [0.0] # Yearly export demand in TWh. Only considered, if ["export"]["endogenous"] is set to false
  export_profile: "ship" # use "ship" or "constant". Only considered, if ["export"]["endogenous"] is set to false
  ship:
    ship_capacity: 0.4 # TWh # 0.05 TWh for new ones, 0.003 TWh for Susio Frontier, 0.4 TWh according to Hampp2021: "Corresponds to 11360 t H2 (l) with LHV of 33.3333 Mwh/t_H2. Cihlar et al 2020 based on IEA 2019, Table 3-B"
    travel_time: 288 # hours # From Agadir to Rotterdam and back (12*24)
    fill_time: 24 # hours, for 48h see Hampp2021
    unload_time: 24 # hours for 48h see Hampp2021

sector:
  include_heat: true # If false, disables all heat demand and heat infrastructure (heat pumps, thermal storage, district heating, etc.)
  gas:
    spatial_gas: true # ALWAYS TRUE
    network: false # ALWAYS FALSE for now (NOT USED)
    network_data: GGIT # Global dataset -> 'GGIT' , European dataset -> 'IGGIELGN'
    network_data_GGIT_status: ["Construction", "Operating", "Idle", "Shelved", "Mothballed", "Proposed"]
  hydrogen:
    network: false
    H2_retrofit_capacity_per_CH4: 0.6
    network_limit: 2000 #GWkm
    network_routes: gas # "gas or "greenfield". If "gas"  ->  the network data are fetched from ["sector"]["gas"]["network_data"]. If "greenfield"  -> the network follows the topology of electrical transmission lines
    gas_network_repurposing: true # If true -> ["sector"]["gas"]["network"] is automatically false
    underground_storage: false
    hydrogen_colors: false
    set_color_shares: false
    blue_share: 0.40
    pink_share: 0.05
    production_technologies: ["H2 Electrolysis", "SMR", "SMR CC"] # ["Alkaline electrolyzer large", "Alkaline electrolyzer medium", "Alkaline electrolyzer small", "PEM electrolyzer", "SOEC", "Solid biomass steam reforming", "Biomass gasification", "Biomass gasification CC", "Natural gas steam reforming", "Natural gas steam reforming CC", "Coal gasification", "Coal gasification CC", "Heavy oil partial oxidation"] a list of H2 production technologies that can be added

  coal:
    spatial_coal: true
    shift_to_elec: true # If true, residential and services demand of coal is shifted to electricity. If false, the final energy demand of coal is disregarded
  lignite:
    spatial_lignite: true

  international_bunkers: true # Whether or not to count the emissions of international aviation and navigation

  oil:
    spatial_oil: true

  district_heating:
    potential: 0.3 #maximum fraction of urban demand which can be supplied by district heating
    #increase of today's district heating demand to potential maximum district heating share
    #progress = 0 means today's district heating share, progress=-1 means maximum fraction of urban demand is supplied by district heating
    progress: 1
    # 2020: 0.0
    # 2030: 0.3
    # 2040: 0.6
    # 2050: 1.0
    district_heating_loss: 0.15
  reduce_space_heat_exogenously: false # reduces space heat demand by a given factor (applied before losses in DH)
  # this can represent e.g. building renovation, building demolition, or if
  # the factor is negative: increasing floor area, increased thermal comfort, population growth
  reduce_space_heat_exogenously_factor: 0.29 # per unit reduction in space heat demand
  # the default factors are determined by the LTS scenario from http://tool.european-calculator.eu/app/buildings/building-types-area/?levers=1ddd4444421213bdbbbddd44444ffffff11f411111221111211l212221
  # 2020: 0.10  # this results in a space heat demand reduction of 10%
  # 2025: 0.09  # first heat demand increases compared to 2020 because of larger floor area per capita
  # 2030: 0.09
  # 2035: 0.11
  # 2040: 0.16
  # 2045: 0.21
  # 2050: 0.29

  tes: true
  tes_tau: # 180 day time constant for centralised, 3 day for decentralised
    decentral: 3
    central: 180
  boilers: true
  oil_boilers: false
  chp: true
  micro_chp: false
  solar_thermal: true
  heat_pump_sink_T: 55 #Celsius, based on DTU / large area radiators; used un build_cop_profiles.py
  time_dep_hp_cop: true #time dependent heat pump coefficient of performance
  solar_cf_correction: 0.788457 # = >>>1/1.2683
  bev_plug_to_wheel_efficiency: 0.2 #kWh/km from EPA https://www.fueleconomy.gov/feg/ for Tesla Model S
  bev_charge_efficiency: 0.9 #BEV (dis-)charging efficiency
  transport_heating_deadband_upper: 20.
  transport_heating_deadband_lower: 15.
  ICE_lower_degree_factor: 0.375 #in per cent increase in fuel consumption per degree above deadband
  ICE_upper_degree_factor: 1.6
  EV_lower_degree_factor: 0.98
  EV_upper_degree_factor: 0.63
  bev_avail_max: 0.95
  bev_avail_mean: 0.8
  bev_dsm_restriction_value: 0.75 #Set to 0 for no restriction on BEV DSM
  bev_dsm_restriction_time: 7 #Time at which SOC of BEV has to be dsm_restriction_value
  v2g: false #allows feed-in to grid from EV battery
  bev_dsm: false #turns on EV battery
  bev_energy: 0.05 #average battery size in MWh
  bev_availability: 0.5 #How many cars do smart charging
  transport_fuel_cell_efficiency: 0.5
  transport_internal_combustion_efficiency: 0.3
  industry_util_factor: 0.7

  biomass_transport: false # biomass transport between nodes
  biomass_transport_default_cost: 0.1 #EUR/km/MWh
  solid_biomass_potential: 8500 # TWh/a, Potential of whole modelled area
  biogas_potential: 500 # TWh/a, Potential of whole modelled area

  efficiency_heat_oil_to_elec: 0.9
  efficiency_heat_biomass_to_elec: 0.9
  efficiency_heat_gas_to_elec: 0.9

  electricity_distribution_grid: false # adds low voltage buses and shifts AC loads, BEVs, heat pumps, and resistive heaters, micro CHPs to low voltage buses if technologies are present
  solar_rooftop: true # adds distribution side customer rooftop PV (only work if electricity_distribution_grid: true)
  home_battery: true # adds home batteries to low voltage buses ((only work if electricity_distribution_grid: true)
  transmission_efficiency:
    electricity distribution grid:
      efficiency_static: 0.97 # efficiency of distribution grid (i.e. 3% loses)
    H2 pipeline:
      efficiency_per_1000km: 1
      compression_per_1000km: 0.017 # DEA technology data. Mean of  Energy losses, lines 5000-20000 MW and lines >20000 MW for 2020, 2030 and 2050, [%/1000 km]

existing_capacities:
  grouping_years_power: [1960, 1965, 1970, 1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020] # change to 2025, if first ph is 2025
  grouping_years_heat: [1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2019] # these should not extend 2020

load_options: # this is elec only (only profile is kept, totals are overwritten by demand_data)
  ssp: "ssp2-2.6" # shared socio-economic pathway (GDP and population growth) scenario to consider
  weather_year: 2013 # Load scenarios available with different weather year (different renewable potentials)
  prediction_year: 2020 # Load scenarios available with different prediction year (GDP, population)
  scale: 1.0 # scales all load time-series, i.e. 2 = doubles load

demand_data: # this is sector-coupled
  update_data: false # if true, the workflow downloads the energy balances data saved in data/demand/unsd/data again. Turn on for the first run.
  base_year: 2019

  other_industries: false # Whether or not to include industries that are not specified. some countries have has exaggerated numbers, check carefully.
  aluminium_year: 2019 # Year of the aluminium demand data specified in `data/AL_production.csv`

costs:
  year: 2020 
  customized: true
  version: v0.13.2
  discountrate: [0.071] #, 0.086, 0.111]
  # [EUR/USD] ECB: https://www.ecb.europa.eu/stats/exchange/eurofxref/html/eurofxref-graph-usd.en.html # noqa: E501
  USD2013_to_EUR2013: 0.7532 # [EUR/USD] ECB: https://www.ecb.europa.eu/stats/exchange/eurofxref/html/eurofxref-graph-usd.en.html
  rooftop_share: 0.14 # based on the potentials, assuming  (0.1 kW/m2 and 10 m2/person)
  fill_values:
    FOM: 0
    VOM: 0
    efficiency: 1
    fuel: 0
    investment: 0
    lifetime: 25
    CO2 intensity: 0
    discount rate: 0.07
  marginal_cost: # EUR/MWh
    solar: 0.01
    onwind: 0.015
    offwind: 0.015
    hydro: 0.
    H2: 0.
    electrolysis: 0.
    fuel cell: 0.
    battery: 0.
    battery inverter: 0.
  emission_prices: # in currency per tonne emission, only used with the option Ep
    co2: 0.
  # investment: # EUR/MW
  #   CCGT: 830000
  # FOM: # %/year
  #   CCGT: 3.35
  # VOM: # EUR/MWh
  #   CCGT: 4.2
  # fuel: # EUR/MWh
  #   gas: 10.1
  # lifetime: # years
  #   CCGT: 25.0
  # efficiency: # per unit
  #   CCGT: 0.58
  lines:
    length_factor: 1.25 #to estimate offwind connection costs


cluster_options:
  simplify_network:
    to_substations: false # network is simplified to nodes with positive or negative power injection (i.e. substations or offwind connections)
    algorithm: kmeans # choose from: [hac, kmeans]
    feature: solar+onwind-time # only for hac. choose from: [solar+onwind-time, solar+onwind-cap, solar-time, solar-cap, solar+offwind-cap] etc.
    exclude_carriers: []
    remove_stubs: true
    remove_stubs_across_borders: false
    p_threshold_drop_isolated: 20 # [MW] isolated buses are being discarded if bus mean power is below the specified threshold
    p_threshold_merge_isolated: 300 # [MW] isolated buses are being merged into a single isolated bus if a bus mean power is below the specified threshold
    s_threshold_fetch_isolated: false # [-] a share of the national load for merging an isolated network into a backbone network
  cluster_network:
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
  alternative_clustering: false # "False" use Voronoi shapes, "True" use GADM shapes
  distribute_cluster: ["load"] # Distributes cluster nodes per country according to ['load'],['pop'] or ['gdp']

renewable:
  onwind:
    cutout: cutout-2013-era5
  offwind-ac:
    cutout: cutout-2013-era5
  offwind-dc:
    cutout: cutout-2013-era5
  solar:
    cutout: cutout-2013-era5
  hydro:
    cutout: cutout-2013-era5
    hydrobasins_level: 6
    resource:
      method: hydro
      hydrobasins: data/hydrobasins/hybas_world.shp
      flowspeed: 1.0 # m/s
      # weight_with_height: false
      # show_progress: true
    carriers: [ror, PHS, hydro]
    PHS_max_hours: 6
    hydro_max_hours: "energy_capacity_totals_by_country" #energy_capacity_totals_by_country
    hydro_max_hours_default: 12.0 # (optional, default 6) Default value of max_hours for hydro when NaN values are found
    clip_min_inflow: 1.0
    extendable: true
    normalization:
      method: eia # 'hydro_capacities' to rescale country hydro production by using hydro_capacities, 'eia' to rescale by eia data, false for no rescaling
      year: 2020 # (optional) year of statistics used to rescale the runoff time series. When not provided, the cutout weather year is used
      quantile_ror: 0.9 # quantile of the inflow distribution beyond which inflow values are clipped for run-of-river plants
      quantile_reservoir: 1. # quantile of the inflow distribution beyond which inflow values are clipped for reservoir plants
      multiplier: 1. # multiplier applied after the normalization of the hydro production; default 1.0
  csp:
    cutout: cutout-2013-era5

solving:
  save_lpfile: false
  options:
    formulation: kirchhoff
    load_shedding: true
    noisy_costs: true
    min_iterations: 4
    max_iterations: 6
    clip_p_max_pu: 0.01
    skip_iterations: true
    track_iterations: false
    assign_all_duals: true
    # nhours: 10
    cluster_to_single_node: false

  solver:
    name: gurobi
    options: gurobi-default # gurobi-nocross # gurobi-high-precision

  solver_options:
    highs-default:
      # refer to https://ergo-code.github.io/HiGHS/dev/options/definitions/
      threads: 4
      solver: "ipm"
      run_crossover: "off"
      small_matrix_value: 1e-6
      large_matrix_value: 1e9
      primal_feasibility_tolerance: 1e-5
      dual_feasibility_tolerance: 1e-5
      ipm_optimality_tolerance: 1e-4
      parallel: "on"
      random_seed: 123
    gurobi-default:
      threads: 16
      method: 2 # barrier
      crossover: 0
      BarConvTol: 1.e-5
      ScaleFlag: -1
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200
    gurobi-numeric-focus:
      NumericFocus: 3 # Favour numeric stability over speed
      method: 2 # barrier
      crossover: 0 # do not use crossover
      BarHomogeneous: 1 # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5
      FeasibilityTol: 1.e-4 
      OptimalityTol: 1.e-4 
      ScaleFlag: -1 
      threads: 16
      Seed: 123
      DualReductions: 0
      InfUnbdInfo: 1
    gurobi-tested:
      FeasibilityTol: 0.0001
      OptimalityTol: 0.0001
      Method: 2
      BarConvTol: 1.e-5
      Crossover: 0
      AggFill: 10
      PreDual: 0
      NumericFocus: 3
      PrePasses: 2
      Presolve: 2
      threads: 24
    gurobi-high-precision:
      NumericFocus: 3
      Method: 2
      Crossover: 1
      FeasibilityTol: 1.e-6
      OptimalityTol: 1.e-6
      ScaleFlag: 2
      Quad: 1
      Threads: 32
      ObjScale: 1
      Seed: 123
      BarHomogeneous: 1
      BarConvTol: 1e-8
      BarOrder: 2
    gurobi-cross:
      NumericFocus: 3          # Favor numeric stability over speed
      Method: 2                # Barrier
      Crossover: 1             # Force crossover on
      BarConvTol: 1.e-8        # Tighter barrier stop -> cleaner handoff to crossover
      BarHomogeneous: -1       # Let Gurobi choose (only use 1 if it picks it)
      BarCorrectors: 2         # More robust barrier steps
      FeasibilityTol: 1.e-6    # Cleaner feasibility for tough models
      OptimalityTol: 1.e-6     # Cleaner optimality for tough models
      ObjScale: 0              # Auto (avoid negative scaling)
      ScaleFlag: -1            # Auto scaling
      Quad: 1                  # Quad precision in sensitive areas
      Threads: 12
      Seed: 123
    gurobi-nocross:
      Method: 2            # Barrier
      Crossover: 0         # Skip crossover big walltime win
      Threads: 32          # Try 32 first; also test 48 or 64 and keep the best
      NumericFocus: 2      # Still cautious, but a bit faster than 3
      BarConvTol: 1.e-7    # Slightly looser; fewer barrier iters, typically same quality
      BarCorrectors: -1    # Let Gurobi pick adaptively
      BarHomogeneous: -1   # Auto
      FeasibilityTol: 1.e-6
      OptimalityTol: 1.e-6
      ObjScale: 0
      ScaleFlag: -1
      Quad: 1
      Seed: 123
    gurobi-dual-simplex:
      NumericFocus: 3
      Method: 1                # Dual simplex (no barrier, no crossover needed)
      Crossover: 0
      FeasibilityTol: 1.e-6
      OptimalityTol: 1.e-6
      ObjScale: 0
      ScaleFlag: -1
      Quad: 0                  # Not used by simplex; can leave 0
      Threads: 12
      Seed: 123
    gurobi-fallback: # Use gurobi defaults
      crossover: 0
      method: 2 # barrier
      BarHomogeneous: 1 # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5
      FeasibilityTol: 1.e-5
      OptimalityTol: 1.e-5
      Seed: 123
      threads: 8
    cplex-default:
      threads: 4
      lpmethod: 4 # barrier
      solutiontype: 2 # non basic solution, ie no crossover
      barrier.convergetol: 1.e-5
      feasopt.tolerance: 1.e-6
    copt-default:
      Threads: 8
      LpMethod: 2
      Crossover: 0
    cbc-default: {} # Used in CI
    glpk-default: {} # Used in CI

  mem: 100000 # MB; raised for stochastic MC branch solves on cluster
  threads: 16

