run:
  name: "Earth_myopic_19" # use this to keep track of runs with different settings
  sector_name: "Global_sect_19" # use this to keep track of sector scenario runs
  shared_cutouts: true # set to true to share the default cutout(s) across runs
  # Note: value false requires build_cutout to be enabled
  allow_scenario_failure: false # If True, the workflow will continue even if a scenario in run_scenario fails

countries: ["Global"]

scenario:
  simpl: [""]
  ll: ["copt"]
  clusters: [110] 
  opts: [1h] 
  planning_horizons:
  - 2020
  - 2025
  - 2030
  - 2035
  - 2040
  - 2045
  - 2050
  sopts:
  - "1h"
  demand:
  - "AB"

foresight: myopic

temporal_clustering:
  activate: true
  n_periods: 10 # number of typical periods (e.g., typical days)
  hours: 24 # hours per period (24 for daily clustering)
  clusterMethod: 'k_medoids'  # clustering algorithm: 'hierarchical', 'k_means', 'k_medoids'
  extremePeriodMethod: 'new_cluster_center'  # how to handle extreme periods
  normed: true # normalize timeseries before clustering
  overwrite_time_dfs: false  # whether to overwrite time-dependent data with clustered values
  use_dt_in_intra: false   # Set to true for dt-scaled intra recursion
  include_inflow_in_intra: false  # Set to true to include inflow/spill in intra
  #constrain_stores: true
  #solver: "gurobi" # not used currently, highs default works

enable:
  retrieve_databundle: false 
  retrieve_databundle_sector: false
  retrieve_cost_data: false # needs to be false if permstore is used for costs
  download_osm_data: false 
  build_natura_raster: false 
  build_cutout: false
  # If "build_cutout" : true, then environmental data is extracted according to `snapshots` date range and `countries`
  # requires cds API key https://cds.climate.copernicus.eu/api-how-to
  # More information https://atlite.readthedocs.io/en/latest/introduction.html#datasets
  progress_bar: true # show progress bar during downloading routines and other long-running tasks

global_specific:
  redistribute_hydro_over_countries: true # If true, hydro generation of missing countries in the powerplants dataset is redistributed to countries with plants according to EIA data
  remove_faulty_offshore_shapes: true # for offwind profiles, remove faulty shapes that cause crashes (default will be False since this is only needed for global model)
  global_clustering: true # must be true to apply minimum clustering per country
  minimum_clustering_per_countries:
    US: 4
    RU: 4
    CN: 4
    BR: 2
    AU: 3
    CA: 2
  countries_to_merge: ['LT', 'AO', 'LA', 'KE', 'ET', 'GE', 'ZM', 'HN', 'CR', 'GT', 'EE', 'PA', 'CM', 'NP', 'CI', 'MN', 'BO', 'PS', 'TZ', 'LV', 'AL', 'MD', 'MK', 'BT', 'SN', 'ZW', 'AF', 'BN', 'AM', 'SV', 'NA', 'NI', 'BW', 'ML', 'TT', 'PG', 'UG', 'JM', 'CG', 'GA', 'ME', 'MT', 'GN', 'SR', 'BS', 'BF', 'MR', 'CY', 'BJ', 'MG', 'NE', 'TG', 'RW', 'SZ', 'MW', 'GQ', 'GY', 'GF', 'YE', 'DJ', 'SS', 'HT', 'TL', 'GM', 'GL', 'BI', 'LR', 'SO', 'LS', 'TD', 'BZ', 'ER', 'SL', 'CF', 'SB', 'GW', 'XK', 'AD']

  baseyear_nonextendable: true # If true, all existing capacities in the baseyear (first planning horizon) are set to non-extendable
  baseyear_generation:
    baseyear_generation_constraint: true # If true, 2020 electrictiy generation is constrained by historical values +- x% in the baseyear (first planning horizon) -- values are scaled proportionally to elec demand
    tolerance: 0.03 # +- x% tolerance for baseyear generation constraint
    units: TWh
    link_bus_carrier: AC
    gen_bus_carrier: AC
    targets:
      solar: 855.23 # could be
      onshore_wind: 1484 # could be
      offshore_wind: 104
      hydro: 4348.0
      nuclear: 2648.0
      coal_lignite_power: 9437.0
      gas_power: 6386.34 # could be but extendable
      oil_power: 775.3 # could be but extendable
      biomass: 615.21
      geothermal: 86.12
    carriers_map:
      solar: ["solar"]
      onshore_wind: ["onwind"]
      offshore_wind: ["offwind-ac","offwind-dc"]
      hydro: ["ror", "hydro"]
      nuclear: ["nuclear"]
      coal_lignite_power: ["coal", "lignite"]
      gas_power: ["CCGT","OCGT"]
      oil_power: ["oil"]
      biomass: 
        - "urban central solid biomass CHP CC"
        - "urban central solid biomass CHP"
        - "biomass"
        - "biomass EOP"
      geothermal: ["geothermal"]

  year2025_generation: 
    year2025_generation_constraint: true
    year: 2025 # numbers below are 2024 but we have 10% tolerance
    tolerance: 0.1
    units: TWh
    link_bus_carrier: AC
    gen_bus_carrier: AC
    targets:
      solar: 2130.0
      onshore_wind: 2350.0
      #offshore_wind: 250.0
      hydro: 4418.0
      nuclear: 2760.0
      coal_lignite_power: 10587.0
      gas_power: 6795.0
      oil_power: 857.0
      biomass: 712.0
      geothermal: 88.0
    carriers_map:
      solar: ["solar"]
      onshore_wind: ["onwind"]
      #offshore_wind: ["offwind-ac","offwind-dc"]
      hydro: ["ror", "hydro"]
      nuclear: ["nuclear"]
      coal_lignite_power: ["coal", "lignite"]
      gas_power: ["CCGT","OCGT"]
      oil_power: ["oil"]
      biomass: 
        - "urban central solid biomass CHP CC"
        - "urban central solid biomass CHP"
        - "biomass"
        - "biomass EOP"
      geothermal: ["geothermal"]

  year2025_capacity:
    year2025_capacity_constraint: true
    year: 2025
    tolerance: 0.1 
    units: GW
    targets:
      solar: 2130.64 # Target installed capacity in GW from 2024
      onwind: 1136.0 # Target installed capacity in GW from 2024

permstore:
  enable: true
  path: /shared/share_cki25/energymodels/pypsa-earth/permstorage
  scenario: "110nodes_1h_7ph"
  use:
    shapes: true
    base_network: true
    bus_regions: true # should be false if base_network is false !
    demand_profiles: true # elec only
    powerplants: true 
    pop_layouts: true
    pop_layouts_clustered: true
    temperatures: true
    heat_demand: true
    transport_data: true
    gas_network: true
    industry_distribution: true # adjusted for gadm clustering
    elec_prepared: true
    renewable_profiles: true
    solar_thermal_profile: true
    costs: true
    raw_osm: true
    clean_osm: true 

electricity:
  extendable_carriers:
      Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT, CCGT]
      StorageUnit: [] # battery, H2
      Store: [battery, H2]
      Link: [H2 pipeline] # H2 pipeline
  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]
  renewable_carriers: [solar, onwind, hydro, offwind-ac, offwind-dc] 
  
  powerplants_filter: (DateOut > 2020 or DateOut != DateOut) and not (Country == 'Germany' and Fueltype == 'Nuclear') # not actively used
  custom_powerplants: replace #  "false" use only powerplantmatching (ppm) data, "merge" combines ppm and custom powerplants, "replace" use only custom powerplants
  
  estimate_renewable_capacities:
    stats: "irena" # False, = greenfield expansion, 'irena' uses IRENA stats to add expansion limits
    year: 2020 # Reference year, available years for IRENA stats are 2000 to 2023
    p_nom_min: 1 # any float, scales the minimum expansion acquired from stats, i.e. 110% of <years>'s capacities => p_nom_min: 1.1
    p_nom_max: false # sets the expansion constraint, False to deactivate this option and use estimated renewable potentials determine by the workflow, float scales the p_nom_min factor accordingly
    technology_mapping:
      # Wind is the Fueltype in ppm.data.Capacity_stats, onwind, offwind-{ac,dc} the carrier in PyPSA-Earth
      Offshore: [offwind-ac, offwind-dc]
      Onshore: [onwind]
      PV: [solar]

build_osm_network:
  group_tolerance_buses: 20000 # [m] (default 5000) Tolerance in meters of the close buses to merge
  force_ac: true # When true, it forces all components (lines and substation) to be AC-only. To be used if DC assets create problem.
  split_overpassing_lines: false # When True, lines overpassing buses are splitted and connected to the buses

build_shape_options:
  gadm_layer_id: 0 # GADM level area used for the gadm_shapes. Codes are country-dependent but roughly: 0: country, 1: region/county-like, 2: municipality-like
  simplify_gadm: true # When true, shape polygons are simplified else no
  update_file: false # When true, all the input files are downloaded again and replace the existing files
  out_logging: true # When true, logging is printed to console
  year: 2020 # reference year used to derive shapes, info on population and info on GDP
  nprocesses: 10 # number of processes to be used in build_shapes

# ------------------- SECTOR OPTIONS -------------------

fossil_reserves:
  oil: 100 #TWh Maybe redundant

export:
  endogenous: false # If true, the export demand is endogenously determined by the model
  endogenous_price: 400 # EUR/MWh # Market price, for wich the hydrogen for endogenous exports is sold. Only considered, if ["export"]["endogenous"] is set to true.
  store: true # [True, False] # specifies whether an export store to balance demand is implemented
  store_capital_costs: "no_costs" # ["standard_costs", "no_costs"] # specifies the costs of the export store. "standard_costs" takes CAPEX of "hydrogen storage tank type 1 including compressor"
  h2export: [0.0] # Yearly export demand in TWh. Only considered, if ["export"]["endogenous"] is set to false
  export_profile: "ship" # use "ship" or "constant". Only considered, if ["export"]["endogenous"] is set to false
  ship:
    ship_capacity: 0.4 # TWh # 0.05 TWh for new ones, 0.003 TWh for Susio Frontier, 0.4 TWh according to Hampp2021: "Corresponds to 11360 t H2 (l) with LHV of 33.3333 Mwh/t_H2. Cihlar et al 2020 based on IEA 2019, Table 3-B"
    travel_time: 288 # hours # From Agadir to Rotterdam and back (12*24)
    fill_time: 24 # hours, for 48h see Hampp2021
    unload_time: 24 # hours for 48h see Hampp2021

sector:
  include_heat: true # If false, disables all heat demand and heat infrastructure (heat pumps, thermal storage, district heating, etc.)
  gas:
    spatial_gas: true # ALWAYS TRUE
    network: false # ALWAYS FALSE for now (NOT USED)
    network_data: GGIT # Global dataset -> 'GGIT' , European dataset -> 'IGGIELGN'
    network_data_GGIT_status: ["Construction", "Operating", "Idle", "Shelved", "Mothballed", "Proposed"]
  hydrogen:
    network: false
    H2_retrofit_capacity_per_CH4: 0.6
    network_limit: 2000 #GWkm
    network_routes: gas # "gas or "greenfield". If "gas"  ->  the network data are fetched from ["sector"]["gas"]["network_data"]. If "greenfield"  -> the network follows the topology of electrical transmission lines
    gas_network_repurposing: true # If true -> ["sector"]["gas"]["network"] is automatically false
    underground_storage: false
    hydrogen_colors: false
    set_color_shares: false
    blue_share: 0.40
    pink_share: 0.05
    production_technologies: ["H2 Electrolysis", "SMR", "SMR CC"] # ["Alkaline electrolyzer large", "Alkaline electrolyzer medium", "Alkaline electrolyzer small", "PEM electrolyzer", "SOEC", "Solid biomass steam reforming", "Biomass gasification", "Biomass gasification CC", "Natural gas steam reforming", "Natural gas steam reforming CC", "Coal gasification", "Coal gasification CC", "Heavy oil partial oxidation"] a list of H2 production technologies that can be added

  coal:
    spatial_coal: true
    shift_to_elec: true # If true, residential and services demand of coal is shifted to electricity. If false, the final energy demand of coal is disregarded
  lignite:
    spatial_lignite: true

  international_bunkers: false # Whether or not to count the emissions of international aviation and navigation

  oil:
    spatial_oil: true

  district_heating:
    potential: 0.3 #maximum fraction of urban demand which can be supplied by district heating
    #increase of today's district heating demand to potential maximum district heating share
    #progress = 0 means today's district heating share, progress=-1 means maximum fraction of urban demand is supplied by district heating
    progress: 1
    # 2020: 0.0
    # 2030: 0.3
    # 2040: 0.6
    # 2050: 1.0
    district_heating_loss: 0.15
  reduce_space_heat_exogenously: false # reduces space heat demand by a given factor (applied before losses in DH)
  # this can represent e.g. building renovation, building demolition, or if
  # the factor is negative: increasing floor area, increased thermal comfort, population growth
  reduce_space_heat_exogenously_factor: 0.29 # per unit reduction in space heat demand
  # the default factors are determined by the LTS scenario from http://tool.european-calculator.eu/app/buildings/building-types-area/?levers=1ddd4444421213bdbbbddd44444ffffff11f411111221111211l212221
  # 2020: 0.10  # this results in a space heat demand reduction of 10%
  # 2025: 0.09  # first heat demand increases compared to 2020 because of larger floor area per capita
  # 2030: 0.09
  # 2035: 0.11
  # 2040: 0.16
  # 2045: 0.21
  # 2050: 0.29

  tes: true
  tes_tau: # 180 day time constant for centralised, 3 day for decentralised
    decentral: 3
    central: 180
  boilers: true
  oil_boilers: false
  chp: true
  micro_chp: false
  solar_thermal: true
  heat_pump_sink_T: 55 #Celsius, based on DTU / large area radiators; used un build_cop_profiles.py
  time_dep_hp_cop: true #time dependent heat pump coefficient of performance
  solar_cf_correction: 0.788457 # = >>>1/1.2683
  bev_plug_to_wheel_efficiency: 0.2 #kWh/km from EPA https://www.fueleconomy.gov/feg/ for Tesla Model S
  bev_charge_efficiency: 0.9 #BEV (dis-)charging efficiency
  transport_heating_deadband_upper: 20.
  transport_heating_deadband_lower: 15.
  ICE_lower_degree_factor: 0.375 #in per cent increase in fuel consumption per degree above deadband
  ICE_upper_degree_factor: 1.6
  EV_lower_degree_factor: 0.98
  EV_upper_degree_factor: 0.63
  bev_avail_max: 0.95
  bev_avail_mean: 0.8
  bev_dsm_restriction_value: 0.75 #Set to 0 for no restriction on BEV DSM
  bev_dsm_restriction_time: 7 #Time at which SOC of BEV has to be dsm_restriction_value
  v2g: true #allows feed-in to grid from EV battery
  bev_dsm: true #turns on EV battery
  bev_energy: 0.05 #average battery size in MWh
  bev_availability: 0.5 #How many cars do smart charging
  transport_fuel_cell_efficiency: 0.5
  transport_internal_combustion_efficiency: 0.3
  industry_util_factor: 0.7

  biomass_transport: true # biomass transport between nodes
  biomass_transport_default_cost: 0.1 #EUR/km/MWh
  solid_biomass_potential: 100.0 # TWh/a, Potential of whole modelled area
  biogas_potential: 40.0 # TWh/a, Potential of whole modelled area

  efficiency_heat_oil_to_elec: 0.9
  efficiency_heat_biomass_to_elec: 0.9
  efficiency_heat_gas_to_elec: 0.9

  electricity_distribution_grid: false # adds low voltage buses and shifts AC loads, BEVs, heat pumps, and resistive heaters, micro CHPs to low voltage buses if technologies are present
  solar_rooftop: true # adds distribution side customer rooftop PV (only work if electricity_distribution_grid: true)
  home_battery: true # adds home batteries to low voltage buses ((only work if electricity_distribution_grid: true)
  transmission_efficiency:
    electricity distribution grid:
      efficiency_static: 0.97 # efficiency of distribution grid (i.e. 3% loses)
    H2 pipeline:
      efficiency_per_1000km: 1
      compression_per_1000km: 0.017 # DEA technology data. Mean of  Energy losses, lines 5000-20000 MW and lines >20000 MW for 2020, 2030 and 2050, [%/1000 km]

  dynamic_transport:
    enable: false # If "True", then the BEV and FCEV shares are obtained depending on the "Co2L"-wildcard (e.g. "Co2L0.70: 0.10"). If "False", then the shares are obtained depending on the "demand" wildcard and "planning_horizons" wildcard as listed below (e.g. "DF_2050: 0.08")
