run:
  name: "Earth_myopic_12" # use this to keep track of runs with different settings
  sector_name: "Global_sect_12" # use this to keep track of sector scenario runs
  shared_cutouts: true # set to true to share the default cutout(s) across runs
  # Note: value false requires build_cutout to be enabled
  allow_scenario_failure: false # If True, the workflow will continue even if a scenario in run_scenario fails

countries: ["Earth"]

scenario:
  simpl: [""]
  ll: ["copt"]
  clusters: [200] 
  opts: [3h] # [3h-solar+c0.5-wind+c0.5]
  planning_horizons: # investment years for myopic and perfect; or costs year for overnight
  - 2020
  - 2030
  - 2040
  - 2050
  sopts:
  - "72h"
  demand:
  - "AB"

foresight: myopic # myopic, perfect, overnight 

enable:
  retrieve_databundle: false 
  retrieve_databundle_sector: false
  retrieve_cost_data: false # needs to be false if permstore is used for costs
  download_osm_data: false 
  build_natura_raster: false 
  build_cutout: false
  # If "build_cutout" : true, then environmental data is extracted according to `snapshots` date range and `countries`
  # requires cds API key https://cds.climate.copernicus.eu/api-how-to
  # More information https://atlite.readthedocs.io/en/latest/introduction.html#datasets
  progress_bar: true # show progress bar during downloading routines and other long-running tasks

global_specific:
  baseyear_nonextendable: true # If true, all existing capacities in the baseyear (first planning horizon) are set to non-extendable
  baseyear_generation:
    baseyear_generation_constraint: false # If true, 2020 electrictiy generation is constrained by historical values +- x% in the baseyear (first planning horizon) -- values are scaled proportionally to elec demand
    tolerance: 0.1 # +- x% tolerance for baseyear generation constraint
    units: TWh
    targets: # in TWh -- for 2020 currently only, currently from owid
      solar: 855
      onshore_wind: 1400
      #offshore_wind: 191
      #run_of_river: 4348
      nuclear: 2648
      #coal: 9437
      #gas: 6386
      #oil: 775
      #biomass: 615
    carriers_map:
      solar: ["solar"]
      onshore_wind: ["onwind"]
      #offshore_wind: ["offwind-ac","offwind-dc"]
      #run_of_river: ["ror"]
      nuclear: ["nuclear"]
      #coal: ["coal"]
      #lignite: ["coal"]
      #gas: ["OCGT","Combined-Cycle Gas"]
      #oil: ["oil"]
      #biomass: ["urban central solid biomass CHP", "uran central solid biomass CHP CC", "biomass", "biomass EOP"]

permstore:
  enable: true
  path: /shared/share_cki25/energymodels/pypsa-earth/permstorage # keeping track of files that don't change -- "big beautiful run 1"
  scenario: "default_2"
  use:
    shapes: true
    base_network: false
    bus_regions: true
    demand_profiles: true # elec only
    powerplants: true
    pop_layouts: true
    pop_layouts_clustered: true
    temperatures: true
    heat_demand: true
    transport_data: true
    gas_network: true
    industry_distribution: true # adjusted for gadm clustering
    elec_prepared: false
    renewable_profiles: true
    solar_thermal_profile: true
    costs: true

electricity:
  extendable_carriers:
      Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT, CCGT]
      StorageUnit: [battery, H2] # battery, H2
      Store: [battery, H2]
      Link: [H2 pipeline] # H2 pipeline
  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]
  renewable_carriers: [solar, onwind, hydro, offwind-ac, offwind-dc] 
  
  powerplants_filter: (DateOut > 2020 or DateOut != DateOut) and not (Country == 'Germany' and Fueltype == 'Nuclear') 
  custom_powerplants: replace #  "false" use only powerplantmatching (ppm) data, "merge" combines ppm and custom powerplants, "replace" use only custom powerplants
  
  estimate_renewable_capacities:
    stats: "irena" # False, = greenfield expansion, 'irena' uses IRENA stats to add expansion limits
    year: 2020 # Reference year, available years for IRENA stats are 2000 to 2023
    p_nom_min: 1 # any float, scales the minimum expansion acquired from stats, i.e. 110% of <years>'s capacities => p_nom_min: 1.1
    p_nom_max: false # sets the expansion constraint, False to deactivate this option and use estimated renewable potentials determine by the workflow, float scales the p_nom_min factor accordingly
    technology_mapping:
      # Wind is the Fueltype in ppm.data.Capacity_stats, onwind, offwind-{ac,dc} the carrier in PyPSA-Earth
      Offshore: [offwind-ac, offwind-dc]
      Onshore: [onwind]
      PV: [solar]

build_osm_network:
  group_tolerance_buses: 20000 # [m] (default 5000) Tolerance in meters of the close buses to merge
  force_ac: true # When true, it forces all components (lines and substation) to be AC-only. To be used if DC assets create problem.
  split_overpassing_lines: false # When True, lines overpassing buses are splitted and connected to the buses

build_shape_options:
  gadm_layer_id: 0 # GADM level area used for the gadm_shapes. Codes are country-dependent but roughly: 0: country, 1: region/county-like, 2: municipality-like
  simplify_gadm: true # When true, shape polygons are simplified else no
  update_file: false # When true, all the input files are downloaded again and replace the existing files
  out_logging: true # When true, logging is printed to console
  year: 2020 # reference year used to derive shapes, info on population and info on GDP
  nprocesses: 10 # number of processes to be used in build_shapes


sector:
  gas:
    spatial_gas: true # ALWAYS TRUE
    network: false # ALWAYS FALSE for now (NOT USED)
    network_data: GGIT # Global dataset -> 'GGIT' , European dataset -> 'IGGIELGN'
    network_data_GGIT_status: ["Construction", "Operating", "Idle", "Shelved", "Mothballed", "Proposed"]
  hydrogen:
    network: true
    H2_retrofit_capacity_per_CH4: 0.6
    network_limit: 2000 #GWkm
    network_routes: gas # "gas or "greenfield". If "gas"  ->  the network data are fetched from ["sector"]["gas"]["network_data"]. If "greenfield"  -> the network follows the topology of electrical transmission lines
    gas_network_repurposing: true # If true -> ["sector"]["gas"]["network"] is automatically false
    underground_storage: false
    hydrogen_colors: false
    set_color_shares: false
    blue_share: 0.40
    pink_share: 0.05
    production_technologies: ["H2 Electrolysis", "SMR", "SMR CC"] # ["Alkaline electrolyzer large", "Alkaline electrolyzer medium", "Alkaline electrolyzer small", "PEM electrolyzer", "SOEC", "Solid biomass steam reforming", "Biomass gasification", "Biomass gasification CC", "Natural gas steam reforming", "Natural gas steam reforming CC", "Coal gasification", "Coal gasification CC", "Heavy oil partial oxidation"] a list of H2 production technologies that can be added

  coal:
    spatial_coal: true
    shift_to_elec: true # If true, residential and services demand of coal is shifted to electricity. If false, the final energy demand of coal is disregarded
  lignite:
    spatial_lignite: false

  international_bunkers: false # Whether or not to count the emissions of international aviation and navigation

  oil:
    spatial_oil: true

  district_heating:
    potential: 0.3 #maximum fraction of urban demand which can be supplied by district heating
    #increase of today's district heating demand to potential maximum district heating share
    #progress = 0 means today's district heating share, progress=-1 means maximum fraction of urban demand is supplied by district heating
    progress: 1
    # 2020: 0.0
    # 2030: 0.3
    # 2040: 0.6
    # 2050: 1.0
    district_heating_loss: 0.15
  reduce_space_heat_exogenously: true # reduces space heat demand by a given factor (applied before losses in DH)
  # this can represent e.g. building renovation, building demolition, or if
  # the factor is negative: increasing floor area, increased thermal comfort, population growth
  reduce_space_heat_exogenously_factor: 0.29 # per unit reduction in space heat demand
  # the default factors are determined by the LTS scenario from http://tool.european-calculator.eu/app/buildings/building-types-area/?levers=1ddd4444421213bdbbbddd44444ffffff11f411111221111211l212221
  # 2020: 0.10  # this results in a space heat demand reduction of 10%
  # 2025: 0.09  # first heat demand increases compared to 2020 because of larger floor area per capita
  # 2030: 0.09
  # 2035: 0.11
  # 2040: 0.16
  # 2045: 0.21
  # 2050: 0.29

  tes: true
  tes_tau: # 180 day time constant for centralised, 3 day for decentralised
    decentral: 3
    central: 180
  boilers: true
  oil_boilers: false
  chp: true
  micro_chp: false
  solar_thermal: true
  heat_pump_sink_T: 55 #Celsius, based on DTU / large area radiators; used un build_cop_profiles.py
  time_dep_hp_cop: true #time dependent heat pump coefficient of performance
  solar_cf_correction: 0.788457 # = >>>1/1.2683
  bev_plug_to_wheel_efficiency: 0.2 #kWh/km from EPA https://www.fueleconomy.gov/feg/ for Tesla Model S
  bev_charge_efficiency: 0.9 #BEV (dis-)charging efficiency
  transport_heating_deadband_upper: 20.
  transport_heating_deadband_lower: 15.
  ICE_lower_degree_factor: 0.375 #in per cent increase in fuel consumption per degree above deadband
  ICE_upper_degree_factor: 1.6
  EV_lower_degree_factor: 0.98
  EV_upper_degree_factor: 0.63
  bev_avail_max: 0.95
  bev_avail_mean: 0.8
  bev_dsm_restriction_value: 0.75 #Set to 0 for no restriction on BEV DSM
  bev_dsm_restriction_time: 7 #Time at which SOC of BEV has to be dsm_restriction_value
  v2g: true #allows feed-in to grid from EV battery
  bev_dsm: true #turns on EV battery
  bev_energy: 0.05 #average battery size in MWh
  bev_availability: 0.5 #How many cars do smart charging
  transport_fuel_cell_efficiency: 0.5
  transport_internal_combustion_efficiency: 0.3
  industry_util_factor: 0.7

  biomass_transport: true # biomass transport between nodes
  biomass_transport_default_cost: 0.1 #EUR/km/MWh
  solid_biomass_potential: 685 # TWh/a, Potential of whole modelled area (= Global elec generation in 2020)
  biogas_potential: 0.5 # TWh/a, Potential of whole modelled area

  efficiency_heat_oil_to_elec: 0.9
  efficiency_heat_biomass_to_elec: 0.9
  efficiency_heat_gas_to_elec: 0.9

  electricity_distribution_grid: false # adds low voltage buses and shifts AC loads, BEVs, heat pumps, and resistive heaters, micro CHPs to low voltage buses if technologies are present
  solar_rooftop: true # adds distribution side customer rooftop PV (only work if electricity_distribution_grid: true)
  home_battery: true # adds home batteries to low voltage buses ((only work if electricity_distribution_grid: true)
  transmission_efficiency:
    electricity distribution grid:
      efficiency_static: 0.97 # efficiency of distribution grid (i.e. 3% loses)
    H2 pipeline:
      efficiency_per_1000km: 1
      compression_per_1000km: 0.017 # DEA technology data. Mean of  Energy losses, lines 5000-20000 MW and lines >20000 MW for 2020, 2030 and 2050, [%/1000 km]

dynamic_transport:
  enable: false # If "True", then the BEV and FCEV shares are obtained depending on the "Co2L"-wildcard (e.g. "Co2L0.70: 0.10"). If "False", then the shares are obtained depending on the "demand" wildcard and "planning_horizons" wildcard as listed below (e.g. "DF_2050: 0.08")
  land_transport_electric_share:
    Co2L2.0: 0.00
    Co2L1.0: 0.01
    Co2L0.90: 0.03
    Co2L0.80: 0.06
    Co2L0.70: 0.10
    Co2L0.60: 0.17
    Co2L0.50: 0.27
    Co2L0.40: 0.40
    Co2L0.30: 0.55
    Co2L0.20: 0.69
    Co2L0.10: 0.80
    Co2L0.00: 0.88
  land_transport_fuel_cell_share:
    Co2L2.0: 0.01
    Co2L1.0: 0.01
    Co2L0.90: 0.01
    Co2L0.80: 0.01
    Co2L0.70: 0.01
    Co2L0.60: 0.01
    Co2L0.50: 0.01
    Co2L0.40: 0.01
    Co2L0.30: 0.01
    Co2L0.20: 0.01
    Co2L0.10: 0.01
    Co2L0.00: 0.01

  land_transport_fuel_cell_share: # 1 means all FCEVs HERE
    BU_2020: 0.00
    AP_2020: 0.001   # tiny pilot deployments
    NZ_2020: 0.010   # larger pilot programs
    DF_2020: 0.0005  # near zero
    AB_2020: 0.001   # realistic: same as AP pilots

    BU_2030: 0.00
    AP_2030: 0.006   # niche heavy-duty market uptake
    NZ_2030: 0.030   # net-zero pushes hydrogen corridors
    DF_2030: 0.002
    AB_2030: 0.004   # early adoption for freight

    BU_2040: 0.00
    AP_2040: 0.020   # expanding to some light-duty use
    NZ_2040: 0.060   # strong ramp-up
    DF_2040: 0.005
    AB_2040: 0.015   # steady but not explosive growth

    BU_2050: 0.00
    AP_2050: 0.040   # significant but still below BEVs
    NZ_2050: 0.100   # complementing near-total BEV adoption
    DF_2050: 0.010
    AB_2050: 0.050   # realistic: trucks, buses, niche LDVs on hydrogen

  land_transport_electric_share: # 1 means 100% EV adoption
    BU_2020: 0.00    # BAU: negligible EV penetration
    AP_2020: 0.03    # AP: 3% of fleet already EV
    NZ_2020: 0.06    # NZ: faster early rollout
    DF_2020: 0.005   # DF: almost no EVs
    AB_2020: 0.005   # AB: similar to DF, early pilots only

    BU_2030: 0.00
    AP_2030: 0.10    # ~10% fleet share under moderate policies
    NZ_2030: 0.25    # strong net-zero trajectory
    DF_2030: 0.01    # very limited
    AB_2030: 0.02    # realistic: small but visible growth

    BU_2040: 0.02    # small natural market adoption
    AP_2040: 0.35    # >1/3 of fleet electric
    NZ_2040: 0.65    # aggressive transition
    DF_2040: 0.03    # still lagging
    AB_2040: 0.08    # realistic, moderate growth

    BU_2050: 0.05    # still mostly ICE
    AP_2050: 0.55    # just over half fleet electric
    NZ_2050: 0.90    # near full electrification
    DF_2050: 0.05    # some uptake but ICE still dominates
    AB_2050: 0.25    # realistic: 1 in 4 vehicles electric

  co2_network: true
  co2_sequestration_potential: 200 #MtCO2/a sequestration potential for Europe
  co2_sequestration_cost: 10 #EUR/tCO2 for sequestration of CO2
  shipping_hydrogen_liquefaction: false
  shipping_average_efficiency: 0.4 #For conversion of fuel oil to propulsion in 2011

  shipping_hydrogen_share: #1.0
    BU_2020: 0.00
    AP_2020: 0.00
    NZ_2020: 0.05
    DF_2020: 0.02
    AB_2020: 0.01   # realistic: some pilots, less than DF’s optimistic early start

    BU_2030: 0.00
    AP_2030: 0.00
    NZ_2030: 0.10
    DF_2030: 0.05
    AB_2030: 0.03   # sits between AP (0) and DF (0.05)

    BU_2040: 0.00
    AP_2040: 0.12
    NZ_2040: 0.23
    DF_2040: 0.08
    AB_2040: 0.10   # realistic mid-case between DF and AP

    BU_2050: 0.00
    AP_2050: 0.25
    NZ_2050: 0.36
    DF_2050: 0.12
    AB_2050: 0.18   # comfortably between DF and AP; plausible infrastructure scale-up

  h2_cavern: true
  marginal_cost_storage: 0
  methanation: true
  helmeth: true
  dac: true
  cc_fraction: 0.9
  cc: true
  space_heat_share: 0.6 # the share of space heating from all heating. Remainder goes to water heating.
  airport_sizing_factor: 3

  min_part_load_fischer_tropsch: 0.9

  conventional_generation: # generator : carrier -- added as links in sector-coupled network
    OCGT: gas
    oil: oil
    coal: coal
    lignite: lignite
    biomass: biomass
  keep_existing_capacities: true

existing_capacities:
  grouping_years_power: [1960, 1965, 1970, 1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020] # change to 2025, if first ph is 2025
  grouping_years_heat: [1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2019] # these should not extend 2020

load_options: # this is elec only (only profile is kept, totals are overwritten by demand_data)
  ssp: "ssp2-2.6" # shared socio-economic pathway (GDP and population growth) scenario to consider
  weather_year: 2013 # Load scenarios available with different weather year (different renewable potentials)
  prediction_year: 2020 # Load scenarios available with different prediction year (GDP, population)
  scale: 1.0 # scales all load time-series, i.e. 2 = doubles load

demand_data: # this is sector-coupled
  update_data: true # if true, the workflow downloads the energy balances data saved in data/demand/unsd/data again. Turn on for the first run.
  base_year: 2019

  other_industries: false # Whether or not to include industries that are not specified. some countries have has exaggerated numbers, check carefully.
  aluminium_year: 2019 # Year of the aluminium demand data specified in `data/AL_production.csv`

costs:
  year: 2020 
  customized: true # added by Theo // set to true to skip downloading costs but still use resources/ + RDIR + costs_{planning_horizons/year}.csv
  version: v0.10.0
  discountrate: [0.071] #, 0.086, 0.111]
  # [EUR/USD] ECB: https://www.ecb.europa.eu/stats/exchange/eurofxref/html/eurofxref-graph-usd.en.html # noqa: E501
  USD2013_to_EUR2013: 0.7532 # [EUR/USD] ECB: https://www.ecb.europa.eu/stats/exchange/eurofxref/html/eurofxref-graph-usd.en.html
  rooftop_share: 0.14 # based on the potentials, assuming  (0.1 kW/m2 and 10 m2/person)
  fill_values:
    FOM: 0
    VOM: 0
    efficiency: 1
    fuel: 0
    investment: 0
    lifetime: 25
    CO2 intensity: 0
    discount rate: 0.07
  marginal_cost: # EUR/MWh
    solar: 0.01
    onwind: 0.015
    offwind: 0.015
    hydro: 0.
    H2: 0.
    electrolysis: 0.
    fuel cell: 0.
    battery: 0.
    battery inverter: 0.
  emission_prices: # in currency per tonne emission, only used with the option Ep
    co2: 0.
  # investment: # EUR/MW
  #   CCGT: 830000
  # FOM: # %/year
  #   CCGT: 3.35
  # VOM: # EUR/MWh
  #   CCGT: 4.2
  # fuel: # EUR/MWh
  #   gas: 10.1
  # lifetime: # years
  #   CCGT: 25.0
  # efficiency: # per unit
  #   CCGT: 0.58
  lines:
    length_factor: 1.25 #to estimate offwind connection costs


cluster_options:
  simplify_network:
    to_substations: false # network is simplified to nodes with positive or negative power injection (i.e. substations or offwind connections)
    algorithm: kmeans # choose from: [hac, kmeans]
    feature: solar+onwind-time # only for hac. choose from: [solar+onwind-time, solar+onwind-cap, solar-time, solar-cap, solar+offwind-cap] etc.
    exclude_carriers: []
    remove_stubs: true
    remove_stubs_across_borders: true
    p_threshold_drop_isolated: 20 # [MW] isolated buses are being discarded if bus mean power is below the specified threshold
    p_threshold_merge_isolated: 300 # [MW] isolated buses are being merged into a single isolated bus if a bus mean power is below the specified threshold
    s_threshold_fetch_isolated: false # [-] a share of the national load for merging an isolated network into a backbone network
  cluster_network:
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
  alternative_clustering: true # "False" use Voronoi shapes, "True" use GADM shapes
  distribute_cluster: ["load"] # Distributes cluster nodes per country according to ['load'],['pop'] or ['gdp']

renewable:
  onwind:
    cutout: cutout-2013-era5
  offwind-ac:
    cutout: cutout-2013-era5
  offwind-dc:
    cutout: cutout-2013-era5
  solar:
    cutout: cutout-2013-era5
  hydro:
    cutout: cutout-2013-era5
  csp:
    cutout: cutout-2013-era5

solving:
  options:
    formulation: kirchhoff
    load_shedding: true
    noisy_costs: true
    min_iterations: 4
    max_iterations: 6
    clip_p_max_pu: 0.01
    skip_iterations: true
    track_iterations: false
    assign_all_duals: true
    # nhours: 10

  solver:
    name: gurobi
    options: gurobi-numeric-focus

  solver_options:
    highs-default:
      # refer to https://ergo-code.github.io/HiGHS/dev/options/definitions/
      threads: 4
      solver: "ipm"
      run_crossover: "off"
      small_matrix_value: 1e-6
      large_matrix_value: 1e9
      primal_feasibility_tolerance: 1e-5
      dual_feasibility_tolerance: 1e-5
      ipm_optimality_tolerance: 1e-4
      parallel: "on"
      random_seed: 123
    gurobi-default:
      threads: 8 # 4 
      method: 2 # barrier
      crossover: 0
      BarConvTol: 1.e-4 # 1.e-6
      Seed: 123
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200
    gurobi-numeric-focus:
      NumericFocus: 3 # Favour numeric stability over speed
      method: 2 # barrier
      crossover: 0 # do not use crossover
      BarHomogeneous: 1 # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5 # 1.e-5
      FeasibilityTol: 1.e-4 # 1.e-4
      OptimalityTol: 1.e-4 # 1.e-4 
      ObjScale: -0.5
      threads: 12
      Seed: 123
    gurobi-fallback: # Use gurobi defaults
      crossover: 0
      method: 2 # barrier
      BarHomogeneous: 1 # Use homogeneous barrier if standard does not converge
      BarConvTol: 1.e-5
      FeasibilityTol: 1.e-5
      OptimalityTol: 1.e-5
      Seed: 123
      threads: 8
    cplex-default:
      threads: 4
      lpmethod: 4 # barrier
      solutiontype: 2 # non basic solution, ie no crossover
      barrier.convergetol: 1.e-5
      feasopt.tolerance: 1.e-6
    copt-default:
      Threads: 8
      LpMethod: 2
      Crossover: 0
    cbc-default: {} # Used in CI
    glpk-default: {} # Used in CI

  mem: 300000 #memory in MB; 20 GB enough for 50+B+I+H2; 100 GB for 181+B+I+H2