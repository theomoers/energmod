    # - All others (paper, food, textiles, machinery, etc.) -> other_industries_*
    #
    # Energy efficiency assumptions:
    # - EAF efficiency: 0.65 MWh_steel/MWh_elec (vs BF: 0.55)
    # - H2-DRI efficiency: 0.70 MWh_steel/MWh_H2 (vs BF: 0.55)
